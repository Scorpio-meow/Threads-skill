name: "規則有誤、過時或缺漏"
description: "技能寫的和 Meta 官方文件或 API 的實際行為不一致，或漏了規則"
title: "[rule] "
body:
  - type: markdown
    attributes:
      value: "回報前請先看看[官方 changelog](https://developers.facebook.com/documentation/threads/changelog)：技能開頭寫了文件快照的日期，之後的變動可能還沒收錄。"
  - type: input
    id: section
    attributes:
      label: "技能的哪一節"
      description: "例如 §4.3 或 Compatibility traps"
    validations:
      required: true
  - type: textarea
    id: skill
    attributes:
      label: "技能目前的寫法"
      description: "可以直接貼上 SKILL.md 的原文；如果是漏了規則，寫「沒有提到」。"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "官方文件或 API 的實際行為"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: "依據"
      description: "官方文件或 changelog 的連結；實測結果請附上請求與回應，並移除 token。"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "確認"
      options:
        - label: "我沒有附上 token、App secret 或其他私人資料"
          required: true
