name: "使用問題"
description: "安裝失敗、技能沒有啟用，或裝了技能 AI 助理還是出錯"
title: "[usage] "
body:
  - type: dropdown
    id: kind
    attributes:
      label: "問題類型"
      options:
        - "安裝失敗"
        - "技能沒有啟用"
        - "裝了技能，AI 助理還是寫錯或做錯"
        - "其他"
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: "AI 工具"
      options:
        - "Claude Code"
        - "Claude 應用程式（網頁版／桌面版）"
        - "ChatGPT"
        - "OpenAI Codex"
        - "GitHub Copilot"
        - "Cursor"
        - "Gemini CLI"
        - "Google Antigravity"
        - "Devin Desktop（原 Windsurf）"
        - "OpenCode"
        - "Cline"
        - "Kiro"
        - "JetBrains Junie"
        - "Roo Code"
        - "其他"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: "模型與工具版本"
      description: "例如使用的模型名稱和工具的版本號"
    validations:
      required: false
  - type: dropdown
    id: install
    attributes:
      label: "安裝方式"
      options:
        - "skills 指令"
        - "GitHub CLI（gh skill）"
        - "工具內建的安裝方式（Codex、Gemini CLI、Copilot CLI、Kiro）"
        - "手動複製資料夾"
        - "上傳 ZIP（Claude 應用程式）"
        - "上傳 ZIP（ChatGPT）"
        - "Agensi"
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: "你的提問或操作"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "實際發生的情況"
      description: "錯誤訊息、AI 助理的回覆或產生的程式碼片段。"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "預期的結果"
      description: "如果知道正確的作法，附上官方文件的連結會很有幫助。"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "確認"
      options:
        - label: "我沒有附上 token、App secret 或其他私人資料"
          required: true
