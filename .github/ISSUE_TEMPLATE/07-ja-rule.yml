name: "ルールの誤り・古い情報・抜け"
description: "スキルの内容が Meta の公式ドキュメントや API の実際の動作と違う、またはルールが抜けている"
title: "[rule] "
body:
  - type: markdown
    attributes:
      value: "報告する前に[公式 changelog](https://developers.facebook.com/documentation/threads/changelog)を確認してください。スキルの冒頭にドキュメントのスナップショット日が書かれており、それ以降の変更はまだ反映されていない可能性があります。"
  - type: input
    id: section
    attributes:
      label: "スキルのどの節か"
      description: "例：§4.3、Compatibility traps"
    validations:
      required: true
  - type: textarea
    id: skill
    attributes:
      label: "スキルの現在の記述"
      description: "SKILL.md の原文をそのまま貼っても大丈夫です。ルールが抜けている場合は「記載なし」と書いてください。"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "公式ドキュメントや API の実際の動作"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: "根拠"
      description: "公式ドキュメントや changelog へのリンク。実測結果の場合は、トークンを取り除いたリクエストとレスポンスを添えてください。"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "確認"
      options:
        - label: "トークン、App シークレット、その他の個人情報は含めていません"
          required: true
