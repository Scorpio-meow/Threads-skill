name: "スキル使用時の問題"
description: "インストールに失敗した、スキルが有効にならない、スキルを入れても AI アシスタントが間違える"
title: "[usage] "
body:
  - type: dropdown
    id: kind
    attributes:
      label: "問題の種類"
      options:
        - "インストールに失敗した"
        - "スキルが有効にならない"
        - "スキルを入れても AI アシスタントが間違ったコードや操作をした"
        - "その他"
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: "AI ツール"
      options:
        - "Claude Code"
        - "Claude アプリ（Web 版／デスクトップ版）"
        - "ChatGPT"
        - "OpenAI Codex"
        - "GitHub Copilot"
        - "Cursor"
        - "Gemini CLI"
        - "Google Antigravity"
        - "Devin Desktop（旧 Windsurf）"
        - "OpenCode"
        - "Cline"
        - "Kiro"
        - "JetBrains Junie"
        - "Roo Code"
        - "その他"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: "モデルとツールのバージョン"
      description: "例：使ったモデル名、ツールのバージョン番号"
    validations:
      required: false
  - type: dropdown
    id: install
    attributes:
      label: "インストール方法"
      options:
        - "skills コマンド"
        - "GitHub CLI（gh skill）"
        - "ツール独自のインストール方法（Codex、Gemini CLI、Copilot CLI、Kiro）"
        - "フォルダを手動でコピー"
        - "ZIP をアップロード（Claude アプリ）"
        - "ZIP をアップロード（ChatGPT）"
        - "Agensi"
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: "質問した内容や行った操作"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "実際に起きたこと"
      description: "エラーメッセージ、AI アシスタントの返答、生成されたコードの一部など。"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "期待した結果"
      description: "正しいやり方がわかっている場合は、公式ドキュメントへのリンクがあると助かります。"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "確認"
      options:
        - label: "トークン、App シークレット、その他の個人情報は含めていません"
          required: true
