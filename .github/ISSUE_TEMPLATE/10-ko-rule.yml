name: "규칙 오류·누락·오래된 정보"
description: "스킬 내용이 Meta 공식 문서나 API의 실제 동작과 다르거나, 규칙이 빠져 있음"
title: "[rule] "
body:
  - type: markdown
    attributes:
      value: "제보하기 전에 [공식 changelog](https://developers.facebook.com/documentation/threads/changelog)를 확인해 주세요. 스킬 맨 앞에 문서 스냅샷 날짜가 적혀 있으며, 그 이후의 변경 사항은 아직 반영되지 않았을 수 있습니다."
  - type: input
    id: section
    attributes:
      label: "스킬의 어느 섹션인지"
      description: "예: §4.3, Compatibility traps"
    validations:
      required: true
  - type: textarea
    id: skill
    attributes:
      label: "스킬의 현재 내용"
      description: "SKILL.md 원문을 그대로 붙여 넣어도 됩니다. 규칙이 빠진 경우에는 \"언급 없음\"이라고 적어 주세요."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "공식 문서나 API의 실제 동작"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: "근거"
      description: "공식 문서나 changelog 링크. 실측 결과라면 토큰을 지운 요청과 응답을 첨부해 주세요."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "확인"
      options:
        - label: "토큰, App 시크릿, 기타 개인 정보를 넣지 않았습니다"
          required: true
