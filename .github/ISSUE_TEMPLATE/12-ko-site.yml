name: "사이트 문제"
description: "소개 사이트의 오타, 번역, 레이아웃, 기능, 접근성 문제"
title: "[site] "
body:
  - type: dropdown
    id: kind
    attributes:
      label: "문제 유형"
      options:
        - "내용이나 번역 오류"
        - "레이아웃이나 기능 이상"
        - "접근성 문제"
        - "기타"
    validations:
      required: true
  - type: dropdown
    id: lang
    attributes:
      label: "사이트 표시 언어"
      options:
        - "繁體中文"
        - "English"
        - "日本語"
        - "한국어"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "브라우저, 기기, 보조 기술"
      description: "예: 브라우저와 버전, 휴대폰인지 컴퓨터인지, 사용하는 스크린 리더 등 보조 기술"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "문제 설명"
      description: "사이트의 어느 부분에서, 어떤 작업을 했을 때 일어났는지. 스크린샷도 환영합니다."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "기대한 결과"
    validations:
      required: false
